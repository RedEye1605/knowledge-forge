[project]
name = "knowledge-forge"
version = "0.2.0"
description = "Personal knowledge retention engine with spaced repetition"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Rhendy Japelhendal Saragih Sumbayak", email = "rhendygio19@gmail.com" }
]
dependencies = ["click>=8.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
