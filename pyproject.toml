[project]
name = "knowledge-forge"
version = "0.1.0"
description = "Personal knowledge retention engine with spaced repetition"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
